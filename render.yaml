services:
  - type: web
    name: wyr-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: wyr-api-db
          property: connectionString
databases:
  - name: wyr-api-db
    plan: free
    region: frankfurt
    databaseName: wyr_api_db
    user: wyr_api_db_user
